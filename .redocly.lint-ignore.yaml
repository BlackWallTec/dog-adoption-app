# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi.yaml:
  no-server-example.com:
    - "#/servers/0/url"
  operation-4xx-response:
    - "#/paths/~1api~1health/get/responses"
    - "#/paths/~1api~1perfiles~1logout/post/responses"
    - "#/paths/~1api~1perfiles~1correo-movil~1config/get/responses"
    - "#/paths/~1api~1catalogo~1admin~1tamanos/get/responses"
    - "#/paths/~1api~1catalogo~1admin~1caracteristicas/get/responses"
    - "#/paths/~1api~1catalogo~1admin~1razas/get/responses"
    - "#/paths/~1api~1catalogo~1cliente~1perros~1{id}/get/responses"
    - "#/paths/~1api~1catalogo~1cliente~1filtros/get/responses"
    - "#/paths/~1api~1donativos~1pendientes~1resumen/get/responses"
