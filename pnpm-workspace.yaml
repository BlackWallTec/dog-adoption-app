packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@supabase/supabase-js": ^2.118.0
  "@types/node": ^24
  "@vitest/coverage-v8": 5.0.5
  bcryptjs: ^3.0.3
  cookie-parser: ^1.4.7
  cors: ^2.8.6
  dotenv: ^18.0.8
  express: ^5.3.0
  multer: ^2.5.0
  jsonwebtoken: ^9.0.3
  supabase: ^2.122.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  supertest: ^7.3.1
  vitest: ^5.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  supabase: true
