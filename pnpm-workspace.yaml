  "@supabase/supabase-js": ^2.118.0
  "@types/node": ^24
  "@vitest/coverage-v8": 5.0.5
  cors: ^2.8.6
  dotenv: ^18.0.8
  express: ^5.3.0
  multer: ^2.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
