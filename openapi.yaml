  /api/solicitudes/admin/solicitudes/{id}/resolucion:
    parameters:
      - $ref: "#/components/parameters/IdSolicitud"
    post:
      tags: [Solicitudes]
      operationId: resolverSolicitud
      summary: Registrar decisión sobre una solicitud
      description: |
        Registra la decisión del administrador. Al rechazar es obligatorio enviar un comentario.
        `puede_editar` solo aplica cuando la decisión es `rechazada` y permite al adoptante corregir y reenviar.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolucionSolicitud"
            example:
              state: rechazada
              comment: Falta el comprobante de domicilio legible.
              puede_editar: true
      responses:
        "200":
          description: Resolución guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolucionRespuesta"
              example:
                message: Resolución guardada
                data:
                  id_solicitud: 4f8c1a2b-3d4e-4f5a-8b6c-7d8e9f0a1b2c
                  estado: rechazada
        "400":
          description: Decisión inválida o falta el comentario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSimple"
              examples:
                decisionInvalida:
                  summary: Decisión inválida
                  value:
                    error: Decisión inválida
                comentarioRequerido:
                  summary: Falta comentario al rechazar
                  value:
                    error: El comentario es obligatorio al rechazar la solicitud
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "409":
          description: Conflicto con el estado actual de la solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSimple"
              example:
                error: La solicitud ya no se puede resolver.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          description: No se pudo guardar la resolución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSimple"
              example:
                error: Error al guardar la resolución

