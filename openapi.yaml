  /api/voluntarios/programas/empalmes:
    get:
      tags: [Voluntarios]
      operationId: consultarEmpalmesPrograma
      summary: Consultar empalmes de un horario
      description: Devuelve los programas que se cruzan con un horario propuesto. Solo para `Administrador` o `Root`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: fechaInicio
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-05"
        - name: horaInicio
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{2}:\d{2}$'
            example: "09:00"
        - name: fechaFin
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-05"
        - name: horaFin
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{2}:\d{2}$'
            example: "13:00"
      responses:
        "200":
          description: Empalmes encontrados. Puede ser una lista vacía.
          content:
            application/json:
              schema:
                type: object
                required: [empalmes]
                properties:
                  empalmes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Empalme"
        "400":
          description: Faltan datos del horario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensajeVoluntariado"
              example:
                message: Faltan fechas u horas.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensajeVoluntariado"

  /api/voluntarios/programas:
    post:
      tags: [Voluntarios]
      operationId: crearPrograma
      summary: Crear programa de voluntariado
      description: |
        Crea un programa. Si el horario se cruza con otro programa responde `409` con `code` = `OVERLAP`
        y la lista de `empalmes`. Para crearlo de todos modos, envíe `confirmarEmpalme: true`.
        Solo para `Administrador` o `Root`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoPrograma"
            example:
              nombre: Paseo en el parque
              tipo: Paseo
              descripcion: Paseo guiado con perros en adopción.
              ubicacion: Parque Lira
              fechaInicio: "2026-12-05"
              horaInicio: "09:00"
              fechaFin: "2026-12-05"
              horaFin: "13:00"
              cupoMaximo: 10
              confirmarEmpalme: false
      responses:
        "201":
          description: Programa creado.
          content:
            application/json:
              schema:
                type: object
                required: [success, programa]
                properties:
                  success:
                    type: boolean
                    example: true
                  programa:
                    type: object
                    additionalProperties: true
                    description: Programa creado.
        "400":
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensajeVoluntariado"
              example:
                message: El campo nombre es inválido.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "409":
          description: El horario se cruza con otros programas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEmpalme"
              example:
                code: OVERLAP
                message: Existen jornadas que coinciden con el horario.
                empalmes:
                  - idPrograma: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    nombre: Jornada de limpieza
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensajeVoluntariado"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT (HS256) de la app Android. Requiere el encabezado `x-client: mobile`; sin él, el
        encabezado `Authorization` se ignora.
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Cookie `token` del panel web. La crea `POST /api/perfiles/login`.

  parameters:
    XClient:
      name: x-client
      in: header
      required: false
      description: Usar `mobile` para que la respuesta incluya el `token` en el cuerpo, en lugar de la cookie.
      schema:
        type: string
        enum: [mobile]
    IdPerro:
      name: id
      in: path
      required: true
      description: Identificador del perro.
      schema:
        type: string
        format: uuid
    IdPrograma:
      name: idPrograma
      in: path
      required: true
      description: Identificador del programa de voluntariado.
      schema:
        type: string
        format: uuid
    IdSolicitud:
      name: id
      in: path
      required: true
      description: Identificador de la solicitud de adopción.
      schema:
        type: string
        format: uuid
    IdSolicitudCfdi:
      name: idSolicitud
      in: path
      required: true
      description: Identificador de la solicitud de CFDI.
      schema:
        type: string
        format: uuid

  responses:
    NoAutenticadoSimple:
      description: Falta el token, el token no es válido o venció.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          examples:
            sinToken:
              summary: Sin token
              value:
                error: No autenticado
            tokenInvalido:
              summary: Token inválido o vencido
              value:
                error: Token inválido o expirado
    NoAutenticadoEstandar:
      description: La sesión no es válida o la cuenta ya no existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: No autenticado
            code: UNAUTHENTICATED
    SinPermisos:
      description: La cuenta no tiene el rol requerido para esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: No tienes permisos para esta acción
    LimiteDePeticiones:
      description: Se excedió el límite de peticiones de la ruta.
      headers:
        X-RateLimit-Limit:
          description: Límite de la ventana.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Peticiones restantes.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorLimite"
          example:
            ok: false
            error: "Demasiadas peticiones. Límite permitido: 10 cada 15 m."
    ErrorValidacion:
      description: Datos de registro inválidos. `fields` indica cada campo con error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: Error de validación en los datos
            code: VALIDATION_ERROR
            fields:
              correo: Ingresa un correo válido de Gmail, Outlook, Yahoo, Hotmail o iCloud.
              privacidad: Acepta la política de privacidad
    CodigoInvalido:
      description: El código es incorrecto, venció o ya no se puede usar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: El código no es válido o venció. Solicita uno nuevo.
            code: INVALID_EMAIL_CODE
    OkCorreo:
      description: Operación completada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkRespuesta"
          example:
            ok: true
    RespuestaGenericaCorreo:
      description: Solicitud recibida. Responde igual exista o no la cuenta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MensajeGenerico"
          example:
            message: Si la cuenta corresponde, recibirás un código en tu correo.
    CorreoNoDisponible:
      description: El correo móvil no está habilitado o el proveedor de correo no responde.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: El correo móvil todavía no está habilitado.
            code: EMAIL_UNAVAILABLE
    ErrorInternoSimple:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: Error interno
    ErrorInternoMensaje:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensaje"
          example:
            success: false
            message: Error interno al consultar los datos.
    ErrorInternoEstandar:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: Error interno del servidor
            code: INTERNAL_ERROR
    ErrorInternoInscripcion:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorInscripcion"
          example:
            sucess: false
            code: ERROR_INTERNO
            message: Error interno al procesar la inscripción.
    ErrorInternoVoluntariado:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorVoluntariado"
          example:
            success: false
            code: ERROR_INTERNO
            message: Ocurrió un error. Intenta de nuevo.
    ErrorInternoMensajeVoluntariado:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensajeVoluntariado"
          example:
            message: Error al cargar los tipos.
    ErrorSimpleBadRequest:
      description: Datos incompletos o inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: Faltan datos del archivo (id_perro_temporal, nombreArchivo o tipoMime)
    ErrorMensajeSimple400:
      description: Falta un parámetro obligatorio.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensaje"
          example:
            success: false
            message: Faltan idPerro.
    ErrorValidacionSolicitud:
      description: Datos del formulario inválidos. `fields` indica cada campo con error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
          example:
            error: Datos inválidos.
            code: VALIDATION_ERROR
            fields:
              ocupacion: Faltan los datos generales (ocupación).
              documentos: Faltan documentos obligatorios (INE y Comprobante de domicilio).
    SolicitudYaEnviada:
      description: La solicitud ya fue enviada o no puede modificarse.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensaje"
          example:
            success: false
            message: Ya tienes una solicitud enviada o activa para este perro.
    PerroNoEncontrado:
      description: No se encontró el perro.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensaje"
          example:
            success: false
            message: El perro ya no existe.
    UsuarioNoEncontrado:
      description: No se encontró el usuario.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMensaje"
          example:
            success: false
            message: No se encontró el usuario.
    ErrorCfdi400:
      description: Datos inválidos, archivos faltantes o confirmación pendiente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          examples:
            confirmacion:
              summary: Falta confirmar la revisión del PDF
              value:
                error: Confirma que revisaste el PDF y que corresponde al CFDI del XML.
                codigo: CONFIRMACION_PDF_REQUERIDA
            xmlMalformado:
              summary: XML mal formado
              value:
                error: Adjunta únicamente un PDF y un XML.
    ErrorCfdi404:
      description: No se encontró la solicitud o el CFDI.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: No se encontró la solicitud pendiente de CFDI.
    ErrorCfdi409:
      description: Conflicto con el estado del CFDI, por ejemplo UUID duplicado o correo ya enviado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: Ya existe un CFDI con ese UUID.
            codigo: UUID_DUPLICADO
    ErrorArchivoGrande:
      description: El archivo supera el tamaño permitido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: El archivo supera el límite de 10 MB.
    ErrorCfdi415:
      description: Formato de archivo incorrecto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: El archivo debe ser XML válido.
            codigo: FORMATO_INCORRECTO
    ErrorCfdi422:
      description: El RFC o el monto no coinciden con el donativo, o el donativo no está validado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorSimple"
          example:
            error: El RFC del CFDI no coincide con los datos fiscales.
            codigo: RFC_NO_COINCIDE
    ProgramaNoEncontrado:
      description: No se encontró el programa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorVoluntariado"
          example:
            success: false
            code: PROGRAMA_NO_ENCONTRADO
            message: Este programa ya no está disponible.
    ProgramaNoEncontradoVoluntariado:
      description: No se encontró el programa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorVoluntariado"
          example:
            success: false
            code: PROGRAMA_NO_ENCONTRADO
            message: No encontramos este programa.
    ProgramaNoEncontradoInscripcion:
      description: No se encontró el programa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorInscripcion"
          example:
            sucess: false
            code: PROGRAMA_NO_ENCONTRADO
            message: No encontramos este programa.
    ConflictoInscripcion:
      description: La inscripción no se puede completar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorInscripcion"
          examples:
            sinCupo:
              summary: Sin cupo
              value:
                sucess: false
                code: SIN_CUPO
                message: El programa ya no tiene lugares.
            yaInscrito:
              summary: Ya inscrito
              value:
                sucess: false
                code: YA_INSCRITO
                message: Ya estás inscrito en este programa.
            noDisponible:
              summary: Programa no disponible
              value:
                sucess: false
                code: PROGRAMA_NO_DISPONIBLE
                message: El programa no está abierto a inscripciones.
    RangoInvalido:
      description: El rango de fechas no es válido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorVoluntariado"
          example:
            success: false
            code: RANGO_INVALIDO
            message: El rango de fechas no es válido.
    ValidacionVoluntariado:
      description: Datos del programa inválidos. `campo` indica el dato con error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorVoluntariado"
          example:
            success: false
            code: VALIDACION
            message: El campo nombre es inválido.
            campo: nombre

  schemas:
    # ---------- Errores ----------
    ErrorSimple:
      type: object
      description: Forma de error del middleware de autenticación y de varias rutas de administración.
      required: [error]
      properties:
        error:
          type: string
          example: No autenticado
        codigo:
          type: string
          description: Código opcional para diferenciar el tipo de error, usado por algunas rutas de CFDI.
          example: CONFIRMACION_PDF_REQUERIDA
    ErrorEstandar:
      type: object
      description: Forma de error estándar del módulo de perfiles y del envío de solicitudes.
      required: [error, code]
      properties:
        error:
          type: string
          example: Error de validación en los datos
        code:
          type: string
          description: Código estable que la app usa para decidir qué mostrar.
          example: VALIDATION_ERROR
        fields:
          type: object
          description: Errores por campo.
          additionalProperties:
            type: string
    ErrorMensaje:
      type: object
      description: Forma de error con `message`, usada por catálogo, donativos y algunas rutas de solicitudes.
      required: [message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Datos inválidos.
        error:
          type: string
          description: Presente en algunas respuestas de subida de documentos.
        errors:
          description: Lista de mensajes o mapa de errores por campo.
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: string
        errores:
          type: object
          description: Errores por campo (usado por datos fiscales).
          additionalProperties:
            type: string
    ErrorMensajeSucess:
      type: object
      description: Forma de error de `GET /api/catalogo/cliente/perros/{id}`, que usa la clave `sucess` en la implementación actual.
      required: [sucess, message]
      properties:
        sucess:
          type: boolean
          example: false
        message:
          type: string
          example: Error interno al consultar el perro.
    ErrorVoluntariado:
      type: object
      description: Forma de error del módulo de voluntariado (administración y consulta de programas).
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: PROGRAMA_NO_ENCONTRADO
        message:
          type: string
          example: Este programa ya no está disponible.
        campo:
          type: string
          description: Campo con error, cuando aplica.
        inscritosActivos:
          type: integer
        empalmes:
          type: array
          items:
            $ref: "#/components/schemas/Empalme"
    ErrorInscripcion:
      type: object
      description: Forma de error de inscripciones. Usa la clave `sucess` en la implementación actual.
      required: [sucess, code, message]
      properties:
        sucess:
          type: boolean
          example: false
        code:
          type: string
          example: SIN_CUPO
        message:
          type: string
          example: El programa ya no tiene lugares.
    ErrorMensajeVoluntariado:
      type: object
      description: Forma de error de tipos, empalmes y creación de programas (solo `message`).
      required: [message]
      properties:
        message:
          type: string
          example: Faltan fechas u horas.
        code:
          type: string
          example: OVERLAP
    ErrorEmpalme:
      type: object
      description: Respuesta de conflicto de horario al crear un programa.
      required: [code, message, empalmes]
      properties:
        code:
          type: string
          example: OVERLAP
        message:
          type: string
          example: Existen jornadas que coinciden con el horario.
        empalmes:
          type: array
          items:
            $ref: "#/components/schemas/Empalme"
    ErrorLimite:
      type: object
      description: Respuesta del limitador de peticiones.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: "Demasiadas peticiones. Límite permitido: 60 cada 1 m."

    # ---------- Genéricos ----------
    EstadoServicio:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    OkRespuesta:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    MensajeGenerico:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Si la cuenta corresponde, recibirás un código en tu correo.
    MensajeExitoso:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación completada.
    ListaCatalogo:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    # ---------- Perfiles ----------
    UsuarioSesion:
      type: object
      required: [uuid, rol]
      properties:
        uuid:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        rol:
          type: string
          enum: [Root, Administrador, Cliente]
          example: Cliente
    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          example: ana@gmail.com
        contrasena:
          type: string
          minLength: 1
          example: contrasena123
    LoginRespuesta:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UsuarioSesion"
        token:
          type: string
          description: "Solo cuando la petición incluye `x-client: mobile`."
    PerfilUsuario:
      type: object
      description: Datos personales y de domicilio. El correo no se devuelve aquí.
      required: [nombre, apellidos, fecha_nacimiento]
      properties:
        nombre:
          type: string
          example: Ana
        apellidos:
          type: string
          example: Pérez López
        fecha_nacimiento:
          type: string
          format: date
          example: "1995-04-12"
        telefono:
          type: [string, "null"]
          example: "5512345678"
        calle:
          type: [string, "null"]
          example: Av. Juárez
        numero_exterior:
          type: [string, "null"]
          example: "45"
        codigo_postal:
          type: [string, "null"]
          example: "06000"
    RegistroCuenta:
      type: object
      description: Datos para crear una cuenta. Las reglas de formato se aplican en el servidor.
      required:
        - nombre
        - apellidos
        - fecha_nacimiento
        - correo
        - telefono
        - contrasena
        - confirmContrasena
        - id_codigo_postal
        - calle
        - numero_exterior
        - privacidad
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Ana
        apellidos:
          type: string
          maxLength: 150
          example: Pérez López
        fecha_nacimiento:
          type: string
          format: date
          description: La persona debe tener al menos 18 años.
          example: "1995-04-12"
        correo:
          type: string
          format: email
          maxLength: 254
          description: Solo se aceptan dominios Gmail, Outlook, Yahoo, Hotmail e iCloud.
          example: ana@gmail.com
        telefono:
          type: string
          description: 10 o 12 dígitos. Puede empezar con `+`, que se elimina.
          example: "5512345678"
        contrasena:
          type: string
          minLength: 8
          maxLength: 72
          example: contrasena123
        confirmContrasena:
          type: string
          description: Debe ser idéntica a `contrasena`.
          example: contrasena123
        id_codigo_postal:
          type: string
          format: uuid
          description: Identificador de la colonia del catálogo de códigos postales.
          example: 3f2b8c1e-7a4d-4e9b-9c2f-1d5e6a7b8c9d
        calle:
          type: string
          maxLength: 250
          example: Av. Juárez
        numero_exterior:
          type: string
          maxLength: 9
          example: "45"
        numero_interior:
          type: [string, "null"]
          maxLength: 9
          example: null
        privacidad:
          type: boolean
          description: Debe ser `true` (aceptación del aviso de privacidad).
          example: true
    RegistroRespuesta:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UsuarioSesion"
        requiereConfirmacion:
          type: boolean
          description: Solo aparece cuando la cuenta debe confirmar su correo.
        correoEnviado:
          type: boolean
          description: Indica si el código de confirmación se envió.
    CodigoPostal:
      type: object
      required: [id_codigo_postal, codigo_postal, colonia, municipio, estado]
      properties:
        id_codigo_postal:
          type: string
          format: uuid
        codigo_postal:
          type: string
          example: "06000"
        colonia:
          type: string
          example: Centro
        municipio:
          type: string
          example: Cuauhtémoc
        estado:
          type: string
          example: Ciudad de México
    ConfiguracionCorreoMovil:
      type: object
      required: [habilitado]
      properties:
        habilitado:
          type: boolean
          example: false
    CorreoRequest:
      type: object
      required: [correo]
      properties:
        correo:
          type: string
          format: email
          example: ana@gmail.com
    CorreoConfirmarRequest:
      type: object
      required: [correo, codigo]
      properties:
        correo:
          type: string
          format: email
          example: ana@gmail.com
        codigo:
          type: string
          pattern: '^\d{6}$'
          example: "482913"
    CorreoRestablecerRequest:
      type: object
      required: [correo, codigo, contrasena, confirmContrasena]
      properties:
        correo:
          type: string
          format: email
          example: ana@gmail.com
        codigo:
          type: string
          pattern: '^\d{6}$'
          example: "482913"
        contrasena:
          type: string
          minLength: 8
          maxLength: 72
          example: nuevaContrasena123
        confirmContrasena:
          type: string
          example: nuevaContrasena123

    # ---------- Catálogo ----------
    PerroAdmin:
      type: object
      description: Ficha completa del perro para administración.
      properties:
        id_perro:
          type: string
          format: uuid
        nombre:
          type: string
          example: Luna
        sexo:
          type: string
          example: Hembra
        edad_aprox:
          type: [integer, "null"]
          example: 2
        tamano_medida:
          type: [number, "null"]
          example: 45.5
        descripcion:
          type: [string, "null"]
        esterilizado:
          type: boolean
        vacunado:
          type: boolean
        estado:
          type: string
          example: Disponible
        fecha_ingreso:
          type: string
          format: date-time
        activo:
          type: boolean
        raza:
          type: object
          additionalProperties: true
        tamano:
          type: object
          additionalProperties: true
        multimedia:
          type: array
          items:
            $ref: "#/components/schemas/Multimedia"
      additionalProperties: true
    PerroCliente:
      type: object
      description: Datos del perro para el catálogo de clientes.
      properties:
        id_perro:
          type: string
          format: uuid
        nombre:
          type: string
          example: Luna
        sexo:
          type: string
          example: Hembra
        edad_aprox:
          type: [integer, "null"]
        tamano_medida:
          type: [number, "null"]
        descripcion:
          type: [string, "null"]
        esterilizado:
          type: boolean
        vacunado:
          type: boolean
        estado:
          type: string
        activo:
          type: boolean
      additionalProperties: true
    ListaPerrosCliente:
      type: object
      description: "Respuesta de la lista de perros. Usa la clave `syuccess` en la implementación actual."
      required: [syuccess, data]
      properties:
        syuccess:
          type: boolean
          example: true
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PerroCliente"
              - type: object
                properties:
                  foto_url:
                    type: string
                    description: Primera imagen del perro, o cadena vacía.
                    example: https://xyzcompany.supabase.co/storage/v1/object/public/multimedia_perros/luna.jpg
    Multimedia:
      type: object
      properties:
        url:
          type: string
          format: uri
        tipo:
          type: string
          example: foto
      additionalProperties: true
    NuevoPerro:
      type: object
      description: Datos para registrar un perro. Los campos marcados como obligatorios deben enviarse.
      required:
        - nombre
        - sexo
        - esterilizado
        - vacunado
        - estado
        - id_raza
        - id_tamano
        - multimedia
        - caracteres
      properties:
        nombre:
          type: string
          example: Luna
        sexo:
          type: string
          example: Hembra
        edad_aprox:
          type: integer
          minimum: 0
          maximum: 30
          example: 2
        tamano_medida:
          type: number
          minimum: 0
          maximum: 200
          example: 45.5
        descripcion:
          type: string
          example: Juguetona y tranquila con niños.
        cuidado_especial:
          type: string
          maxLength: 500
          example: Requiere medicación para la alergia cada mañana.
        esterilizado:
          type: boolean
          example: true
        vacunado:
          type: boolean
          example: true
        estado:
          type: string
          example: Disponible
        id_raza:
          type: string
          format: uuid
        id_tamano:
          type: string
          format: uuid
        multimedia:
          type: array
          items:
            $ref: "#/components/schemas/Multimedia"
        caracteres:
          type: array
          items:
            type: string
            format: uuid
    ActualizacionPerro:
      type: object
      description: Campos editables de la ficha. Solo se aceptan estos campos.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 60
          example: Luna
        sexo:
          type: string
          maxLength: 20
          example: Hembra
        edad_aprox:
          type: integer
          minimum: 0
          maximum: 30
          example: 3
        tamano_medida:
          type: [number, "null"]
          minimum: 0
          maximum: 200
          example: 45.5
        descripcion:
          type: [string, "null"]
          maxLength: 1000
          example: Le encanta correr.
        esterilizado:
          type: boolean
          example: true
        vacunado:
          type: boolean
          example: true
        id_raza:
          type: string
          format: uuid
        id_tamano:
          type: string
          format: uuid
    ActivacionEnLote:
      type: object
      required: [idList, action]
      properties:
        idList:
          type: array
          items:
            type: string
            format: uuid
        action:
          type: boolean
          description: "`true` activa, `false` desactiva."
          example: true
    OpcionFiltro:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Mestizo
    SolicitudSubida:
      type: object
      required: [id_perro_temporal, nombreArchivo, tipoMime]
      properties:
        id_perro_temporal:
          type: string
          format: uuid
          description: Identificador temporal del perro antes de registrarlo.
        nombreArchivo:
          type: string
          example: foto_perfil.jpg
        tipoMime:
          type: string
          example: image/jpeg
    SubidaMultimediaRespuesta:
      type: object
      required: [message, uploadUrl, rutaFinal, publicUrl]
      properties:
        message:
          type: string
          example: Pase de subida generado exitosamente
        uploadUrl:
          type: string
          format: uri
          description: URL firmada que vence en 300 segundos.
        rutaFinal:
          type: string
          example: perros/7c9e6679-7425-40de-944b-e07fc1f90ae7/1732633200000_foto_perfil.jpg
        publicUrl:
          type: string
          format: uri

    # ---------- Donativos ----------
    DatosFiscales:
      type: object
      required: [id_usuario, rfc, razon_social, regimen_fiscal, codigo_postal, correo_facturacion]
      properties:
        id_usuario:
          type: string
          format: uuid
        rfc:
          type: string
          example: PEPJ950412ABC
        razon_social:
          type: string
          example: Ana Pérez López
        regimen_fiscal:
          type: string
          example: "612"
        codigo_postal:
          type: string
          example: "06000"
        correo:
          type: string
          format: email
        correo_facturacion:
          type: string
          format: email
          example: ana@gmail.com
        constancia_url:
          type: [string, "null"]
          format: uri
    DatosFiscalesEntrada:
      type: object
      description: Datos fiscales a guardar. El RFC debe tener el formato oficial y se guarda en mayúsculas.
      required: [rfc, razon_social, regimen_fiscal, codigo_postal, correo_facturacion]
      properties:
        rfc:
          type: string
          example: PEPJ950412ABC
        razon_social:
          type: string
          example: Ana Pérez López
        regimen_fiscal:
          type: string
          example: "612"
        codigo_postal:
          type: string
          pattern: '^\d{5}$'
          example: "06000"
        correo_facturacion:
          type: string
          format: email
          example: ana@gmail.com
    DonativoRegistrado:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Donativo registrado.
        data:
          type: object
          required: [id_donativo, estado]
          properties:
            id_donativo:
              type: string
              format: uuid
            estado:
              type: string
              example: Pendiente
    DonativoCliente:
      type: object
      required: [id_donativo, monto, fecha, estado, cfdi_solicitado]
      properties:
        id_donativo:
          type: string
          format: uuid
        monto:
          type: number
          example: 500
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          example: Validado
        cfdi_solicitado:
          type: boolean
    CfdiCliente:
      type: object
      required: [id_solicitud_cfdi, uuid, fecha_carga, donativo]
      properties:
        id_solicitud_cfdi:
          type: string
          format: uuid
        uuid:
          type: string
          format: uuid
          description: UUID fiscal del CFDI.
        fecha_carga:
          type: string
          format: date-time
        donativo:
          type: object
          required: [id_donativo, monto, fecha]
          properties:
            id_donativo:
              type: string
              format: uuid
            monto:
              type: number
            fecha:
              type: string
              format: date-time
    DonativoPendienteAdmin:
      type: object
      required: [id_donativo, monto, fecha, estado, usuario]
      properties:
        id_donativo:
          type: string
          format: uuid
        monto:
          type: number
          example: 500
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          example: Pendiente
        usuario:
          type: object
          required: [nombre, apellidos]
          properties:
            nombre:
              type: string
            apellidos:
              type: string
    DonativoAprobado:
      type: object
      required: [id_donativo, estado]
      properties:
        id_donativo:
          type: string
          format: uuid
        estado:
          type: string
          example: Validado
    SolicitudCfdiPendiente:
      type: object
      required:
        [id_solicitud_cfdi, id_donativo, fecha_solicitud, estado, donante, requiere_revision]
      properties:
        id_solicitud_cfdi:
          type: string
          format: uuid
        id_donativo:
          type: string
          format: uuid
        fecha_solicitud:
          type: string
          format: date-time
        estado:
          type: string
          example: Pendiente
        donante:
          type: string
          example: Ana Pérez López
        requiere_revision:
          type: boolean
    SolicitudCfdiDetalle:
      type: object
      description: Detalle de la solicitud con los datos necesarios para emitir el CFDI.
      required: [donativo, datos_fiscales, cfdi, listo_para_emitir, motivos_revision]
      properties:
        donativo:
          type: object
          additionalProperties: true
        datos_fiscales:
          type: object
          additionalProperties: true
        cfdi:
          type: [object, "null"]
          additionalProperties: true
        listo_para_emitir:
          type: boolean
        motivos_revision:
          type: array
          items:
            type: string
    ArchivosCfdi:
      type: object
      required: [pdf, xml]
      properties:
        pdf:
          type: string
          format: binary
          description: PDF del CFDI, máximo 10 MB.
        xml:
          type: string
          format: binary
          description: XML del CFDI, máximo 5 MB.
    ArchivosCfdiConfirmacion:
      allOf:
        - $ref: "#/components/schemas/ArchivosCfdi"
        - type: object
          required: [confirmar_pdf]
          properties:
            confirmar_pdf:
              type: string
              enum: ["true"]
              description: Debe ser `true`. Confirma que el PDF corresponde al XML.
    CfdiValidado:
      type: object
      required: [valido, uuid, rfc_receptor, monto, donativo]
      properties:
        valido:
          type: boolean
          example: true
        uuid:
          type: string
          format: uuid
        rfc_receptor:
          type: string
          example: PEPJ950412ABC
        monto:
          type: number
          example: 500
        donativo:
          type: object
          required: [id_donativo, monto, rfc]
          properties:
            id_donativo:
              type: string
              format: uuid
            monto:
              type: number
            rfc:
              type: string
    CorreoCfdi:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [Enviado, Error]
        mensaje:
          type: string
          description: Solo aparece cuando el envío falla.
          example: No se pudo enviar el correo. Los archivos siguen disponibles en la app.
    CfdiAlmacenado:
      type: object
      required: [almacenado, correo]
      properties:
        almacenado:
          type: boolean
          example: true
        correo:
          $ref: "#/components/schemas/CorreoCfdi"

    # ---------- Solicitudes ----------
    BorradorSolicitud:
      type: object
      description: |
        Formulario de adopción. Los campos obligatorios dependen de la vivienda y de si hay mascotas:
        `caseroAcepta` es obligatorio salvo que `tipoVivienda` sea `Casa`, y `sobreMascotas` es obligatorio
        si `tuvoMascotas` u `otrasMascotas` son `true`.
      required:
        - idPerro
        - ocupacion
        - tuvoMascotas
        - otrasMascotas
        - motivoAdopcion
        - dondeVivira
        - personasEnCasa
        - todosDeAcuerdo
        - tipoVivienda
        - jardinPatio
        - cuidadosBasicos
        - opinionEsterilizacion
        - tieneVeterinario
        - detalleVeterinario
        - tiempoSolo
        - rutinaDiaria
        - manejoComportamiento
      properties:
        idPerro:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        ocupacion:
          type: string
          maxLength: 100
          example: Diseñadora gráfica
        tuvoMascotas:
          type: boolean
          example: true
        otrasMascotas:
          type: boolean
          example: false
        motivoAdopcion:
          type: string
          maxLength: 100
          example: Quiero compañía en casa.
        dondeVivira:
          type: string
          maxLength: 100
          example: En la sala y el patio
        personasEnCasa:
          type: integer
          minimum: 1
          example: 2
        todosDeAcuerdo:
          type: boolean
          example: true
        tipoVivienda:
          type: string
          description: "`Casa`, `Depto` u `Otro`. Acepta también `casa`, `departamento` u `otro`."
          example: Depto
        jardinPatio:
          type: string
          maxLength: 50
          example: "No"
        caseroAcepta:
          type: boolean
          description: Solo si la vivienda no es casa.
          example: true
        sobreMascotas:
          type: string
          maxLength: 250
          example: Tuve un gato durante 10 años.
        cuidadosBasicos:
          type: string
          maxLength: 250
          example: Paseos diarios y agua fresca.
        opinionEsterilizacion:
          type: string
          maxLength: 250
          example: Estoy de acuerdo.
        tieneVeterinario:
          type: boolean
          example: true
        detalleVeterinario:
          type: string
          maxLength: 250
          example: Clínica Patitas, en mi colonia.
        tiempoSolo:
          type: string
          maxLength: 250
          example: Menos de 4 horas al día.
        rutinaDiaria:
          type: string
          maxLength: 250
          example: Trabajo desde casa.
        manejoComportamiento:
          type: string
          maxLength: 250
          example: Refuerzo positivo.
    BorradorRespuesta:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [id_solicitud, estado]
          properties:
            id_solicitud:
              type: string
              format: uuid
            estado:
              type: string
              example: Borrador
    SubidaDocumento:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: PDF, JPG o PNG de hasta 2 MB.
        tipo:
          type: string
          enum: [INE, DOMICILIO, IDENTIFICACION, COMPROBANTE_DOMICILIO]
          description: Tipo de documento. Si se omite, se usa `INE`.
          example: INE
    DocumentoSubido:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Documento subido y registrado exitosamente
        id_documento:
          type: string
          format: uuid
        url_archivo:
          type: string
          format: uri
        fileName:
          type: string
          example: ine.pdf
        sizeBytes:
          type: integer
          example: 524288
        data:
          type: object
          required: [id_documento, tipo, url_archivo, nombre_archivo, tamano_bytes]
          properties:
            id_documento:
              type: string
              format: uuid
            tipo:
              type: string
              enum: [INE, DOMICILIO]
            url_archivo:
              type: string
              format: uri
            nombre_archivo:
              type: string
            tamano_bytes:
              type: integer
    SolicitudEnviada:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Solicitud enviada correctamente.
        data:
          type: object
          required: [id_solicitud, estado]
          properties:
            id_solicitud:
              type: string
              format: uuid
            estado:
              type: string
              example: Pendiente de Revisión
    SolicitudActiva:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: [object, "null"]
          description: "`null` si el usuario no tiene solicitud activa para el perro."
          required: [id_solicitud, estado]
          properties:
            id_solicitud:
              type: string
              format: uuid
            estado:
              type: [string, "null"]
              example: Borrador
    MiSolicitud:
      type: object
      required:
        [id_solicitud, folio, fecha_solicitud, estado, perro, puede_editar, comentario_admin]
      properties:
        id_solicitud:
          type: string
          format: uuid
        folio:
          type: string
          description: Primeros 8 caracteres del identificador, en mayúsculas, con prefijo `QA-`.
          example: QA-4F8C1A2B
        fecha_solicitud:
          type: string
          format: date-time
        estado:
          type: [string, "null"]
          example: Pendiente de Revisión
        perro:
          type: [object, "null"]
          properties:
            nombre:
              type: string
              example: Luna
            foto_url:
              type: [string, "null"]
              format: uri
        puede_editar:
          type: boolean
        comentario_admin:
          type: [string, "null"]
    PerfilAdoptante:
      type: object
      required: [id_usuario, nombre_completo]
      properties:
        id_usuario:
          type: string
          format: uuid
        nombre_completo:
          type: string
          example: Ana Pérez López
        fecha_nacimiento:
          type: string
          format: date
        ocupacion:
          type: string
          example: ""
        domicilio:
          type: string
          example: Av. Juárez 45, Col. Centro, Cuauhtémoc, Ciudad de México · C.P. 06000
        municipio:
          type: string
          example: Cuauhtémoc
        telefono:
          type: string
          example: "5512345678"
        correo:
          type: string
          format: email
          example: ana@gmail.com
    ListaSolicitudesAdmin:
      type: object
      required: [data, resumen, paginacion]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SolicitudAdminResumen"
        resumen:
          type: object
          required: [todas, pendientes, aprobadas, rechazadas]
          properties:
            todas:
              type: integer
              example: 24
            pendientes:
              type: integer
              example: 10
            aprobadas:
              type: integer
              example: 8
            rechazadas:
              type: integer
              example: 6
        paginacion:
          type: object
          required: [page, page_size, total]
          properties:
            page:
              type: integer
              example: 1
            page_size:
              type: integer
              example: 10
            total:
              type: integer
              example: 24
    SolicitudAdminResumen:
      type: object
      required: [id, folio, fecha, estado, adoptante, perro]
      properties:
        id:
          type: string
          format: uuid
        folio:
          type: string
          example: QA-4F8C1A2B
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum: [por_revisar, en_revision, aprobada, rechazada]
          description: Estado normalizado. `pendiente` y `borrador` se convierten a `por_revisar`.
        adoptante:
          type: object
          required: [nombre, apellidos, email]
          properties:
            nombre:
              type: string
            apellidos:
              type: string
            email:
              type: string
              format: email
        perro:
          type: object
          required: [id, nombre, foto_url]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
            foto_url:
              type: string
              format: uri
    DetalleSolicitudAdmin:
      type: object
      required:
        [
          id,
          folio,
          fecha,
          estado,
          comentario_admin,
          puede_editar,
          adoptante,
          perro,
          secciones,
          documentos,
        ]
      properties:
        id:
          type: string
          format: uuid
        folio:
          type: string
          example: QA-4F8C1A2B
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum: [por_revisar, en_revision, aprobada, rechazada]
        comentario_admin:
          type: string
        puede_editar:
          type: boolean
        adoptante:
          type: object
          additionalProperties: true
        perro:
          type: object
          additionalProperties: true
        secciones:
          type: array
          description: Respuestas agrupadas como en el formulario de la app.
          items:
            type: object
            required: [titulo, respuestas]
            properties:
              titulo:
                type: string
                example: Tu hogar
              respuestas:
                type: array
                items:
                  type: object
                  required: [pregunta, respuesta]
                  properties:
                    pregunta:
                      type: string
                    respuesta:
                      description: Texto, número, `Sí`, `No` o `null` si no hubo respuesta.
        documentos:
          type: array
          items:
            type: object
            required: [id, tipo, url, estado_revision]
            properties:
              id:
                type: string
                format: uuid
              tipo:
                type: string
                example: INE
              url:
                type: string
                format: uri
              estado_revision:
                type: string
    ResolucionSolicitud:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [en_revision, periodo_prueba, aprobada, rechazada]
          example: rechazada
        comment:
          type: string
          description: Obligatorio cuando `state` es `rechazada`.
          example: Falta el comprobante de domicilio legible.
        puede_editar:
          type: boolean
          description: Solo aplica con `rechazada`. Permite al adoptante corregir y reenviar.
          example: true
    ResolucionRespuesta:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
          example: Resolución guardada
        data:
          type: object
          additionalProperties: true

    # ---------- Voluntarios ----------
    ProgramaResumen:
      type: object
      required:
        [
          id_programa,
          nombre,
          tipo,
          fecha_inicio,
          fecha_fin,
          ubicacion,
          cupo_maximo,
          cupo_disponible,
          usuario_inscrito,
        ]
      properties:
        id_programa:
          type: string
          format: uuid
        nombre:
          type: string
          example: Paseo en el parque
        tipo:
          type: string
          example: Paseo
        fecha_inicio:
          type: string
          example: "2026-12-05T09:00:00"
        fecha_fin:
          type: string
          example: "2026-12-05T13:00:00"
        ubicacion:
          type: string
          example: Parque Lira
        cupo_maximo:
          type: [integer, "null"]
          description: "`null` significa sin límite."
          example: 10
        cupo_disponible:
          type: [integer, "null"]
          minimum: 0
          example: 6
        usuario_inscrito:
          type: boolean
        estado_del_programa:
          type: [string, "null"]
          example: Abierto
      additionalProperties: true
    ListaProgramas:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProgramaResumen"
    DetallePrograma:
      allOf:
        - $ref: "#/components/schemas/ProgramaResumen"
        - type: object
          properties:
            descripcion:
              type: [string, "null"]
            tipo_descripcion:
              type: [string, "null"]
            inscritos:
              type: integer
              minimum: 0
              example: 4
    InscripcionCreada:
      type: object
      required: [sucess, data]
      description: Respuesta de inscripción exitosa. Usa la clave `sucess` en la implementación actual.
      properties:
        sucess:
          type: boolean
          example: true
        data:
          type: object
          required: [id_programa, fecha_inscripcion, estado]
          properties:
            id_programa:
              type: string
              format: uuid
            fecha_inscripcion:
              type: string
              example: "2026-11-20T10:00:00"
            estado:
              type: string
              example: Aceptado
    ProgramaEditable:
      type: object
      description: Datos del programa para su edición.
      properties:
        idPrograma:
          type: string
          format: uuid
        nombre:
          type: string
          example: Paseo en el parque
        tipo:
          type: string
          example: Paseo
        descripcion:
          type: [string, "null"]
        ubicacion:
          type: string
          example: Parque Lira
        fechaInicio:
          type: string
          format: date
          example: "2026-12-05"
        horaInicio:
          type: string
          example: "09:00"
        fechaFin:
          type: string
          format: date
          example: "2026-12-05"
        horaFin:
          type: string
          example: "13:00"
        cupoMaximo:
          type: [integer, "null"]
          example: 10
        inscritosActivos:
          type: integer
          minimum: 0
          example: 4
        editable:
          type: boolean
      additionalProperties: true
    EdicionPrograma:
      type: object
      description: Campos a cambiar. Los que no se envían conservan su valor actual.
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 50
        tipo:
          type: string
          maxLength: 20
        descripcion:
          type: string
          maxLength: 1000
        ubicacion:
          type: string
          maxLength: 100
        fechaInicio:
          type: string
          format: date
        horaInicio:
          type: string
          pattern: '^\d{2}:\d{2}$'
        fechaFin:
          type: string
          format: date
        horaFin:
          type: string
          pattern: '^\d{2}:\d{2}$'
        cupoMaximo:
          type: integer
          minimum: 1
        confirmarEmpalme:
          type: boolean
          description: Confirma la creación o edición aunque haya empalmes.
    ResultadoEdicionPrograma:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [programa, inscritosActivos, avisarInscritos]
          properties:
            programa:
              type: object
              additionalProperties: true
            inscritosActivos:
              type: integer
              example: 5
            avisarInscritos:
              type: boolean
              description: "`true` cuando cambian la fecha, la hora o la ubicación y hay inscritos."
              example: true
    CancelacionPrograma:
      type: object
      additionalProperties: false
      properties:
        motivo:
          type: [string, "null"]
          maxLength: 200
          example: Lluvia pronosticada para todo el día.
    ListaInscritos:
      type: object
      required: [programa, totalInscritos, inscritos]
      properties:
        programa:
          type: object
          required: [idPrograma, nombre, tipo, fechaInicio, fechaFin, ubicacion, cupoMaximo, estado]
          properties:
            idPrograma:
              type: string
              format: uuid
            nombre:
              type: string
            tipo:
              type: string
            fechaInicio:
              type: string
            fechaFin:
              type: string
            ubicacion:
              type: string
            cupoMaximo:
              type: [integer, "null"]
            estado:
              type: [string, "null"]
        totalInscritos:
          type: integer
          example: 2
        inscritos:
          type: array
          items:
            type: object
            required: [idUsuario, nombreCompleto, correo, telefono, fechaInscripcion, asistencia]
            properties:
              idUsuario:
                type: string
                format: uuid
              nombreCompleto:
                type: [string, "null"]
              correo:
                type: [string, "null"]
              telefono:
                type: [string, "null"]
              fechaInscripcion:
                type: string
              asistencia:
                type: [boolean, "null"]
                description: "`true` asistió, `false` no asistió, `null` sin pase de lista."
    CalendarioProgramas:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [programas, semanasSinCobertura]
          properties:
            programas:
              type: array
              items:
                type: object
                required:
                  [idPrograma, nombre, tipo, inicio, fin, ubicacion, cupoMaximo, inscritos, estado]
                properties:
                  idPrograma:
                    type: string
                    format: uuid
                  nombre:
                    type: string
                  tipo:
                    type: string
                  inicio:
                    type: string
                  fin:
                    type: string
                  ubicacion:
                    type: string
                  cupoMaximo:
                    type: [integer, "null"]
                  inscritos:
                    type: integer
                  estado:
                    type: string
            semanasSinCobertura:
              type: array
              description: Semanas (lunes a lunes) sin ningún programa activo.
              items:
                type: object
                required: [inicio, fin]
                properties:
                  inicio:
                    type: string
                    format: date
                  fin:
                    type: string
                    format: date
    TipoPrograma:
      type: object
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
          example: Paseo
        descripcion:
          type: string
          example: Paseos con perros en el parque.
      additionalProperties: true
    NuevoTipoPrograma:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 20
          example: Paseo
        descripcion:
          type: string
          maxLength: 200
          default: ""
          example: Paseos con perros en el parque.
    Empalme:
      type: object
      description: Programa que se cruza con el horario propuesto.
      properties:
        idPrograma:
          type: string
          format: uuid
        nombre:
          type: string
        fechaInicio:
          type: string
        fechaFin:
          type: string
      additionalProperties: true
    NuevoPrograma:
      type: object
      required:
        [
          nombre,
          tipo,
          descripcion,
          ubicacion,
          fechaInicio,
          horaInicio,
          fechaFin,
          horaFin,
          cupoMaximo,
        ]
      properties:
        nombre:
          type: string
          maxLength: 50
          example: Paseo en el parque
        tipo:
          type: string
          maxLength: 20
          example: Paseo
        descripcion:
          type: string
          maxLength: 1000
          example: Paseo guiado con perros en adopción.
        ubicacion:
          type: string
          maxLength: 100
          example: Parque Lira
        fechaInicio:
          type: string
          format: date
          example: "2026-12-05"
        horaInicio:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "09:00"
        fechaFin:
          type: string
          format: date
          example: "2026-12-05"
        horaFin:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "13:00"
        cupoMaximo:
          type: integer
          minimum: 1
          example: 10
        confirmarEmpalme:
          type: boolean
          description: Confirma la creación aunque el horario se cruce con otros programas.
          example: false
