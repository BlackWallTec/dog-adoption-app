  # ============================================================
  # SOLICITUDES
  # ============================================================
  /api/solicitudes:
    post:
      tags: [Solicitudes]
      operationId: guardarBorradorSolicitud
      summary: Crear o actualizar borrador de solicitud
      description: |
        Guarda el formulario de adopción como borrador para un perro. Si ya existe un borrador para ese perro,
        lo actualiza y responde `200`. Si no existe, lo crea y responde `201`.

        Acepta los nombres en camelCase de este esquema, y también sus equivalentes en snake_case que usa la app
        (`id_perro`, `tuvo_mascotas`, `motivo_adopcion`, etc.). No acepta `idUsuario`; el usuario sale del token.

        Si ya hay una solicitud enviada para el perro, responde `409`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorradorSolicitud"
            example:
              idPerro: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              ocupacion: Diseñadora gráfica
              tuvoMascotas: true
              otrasMascotas: false
              motivoAdopcion: Quiero compañía en casa.
              dondeVivira: En la sala y el patio
              personasEnCasa: 2
              todosDeAcuerdo: true
              tipoVivienda: Depto
              jardinPatio: "No"
              caseroAcepta: true
              sobreMascotas: Tuve un gato durante 10 años.
              cuidadosBasicos: Paseos diarios y agua fresca.
              opinionEsterilizacion: Estoy de acuerdo.
              tieneVeterinario: true
              detalleVeterinario: Clínica Patitas, en mi colonia.
              tiempoSolo: Menos de 4 horas al día.
              rutinaDiaria: Trabajo desde casa.
              manejoComportamiento: Refuerzo positivo.
      responses:
        "200":
          description: Borrador actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorradorRespuesta"
              example:
                success: true
                data:
                  id_solicitud: 4f8c1a2b-3d4e-4f5a-8b6c-7d8e9f0a1b2c
                  estado: Borrador
        "201":
          description: Borrador creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorradorRespuesta"
              example:
                success: true
                data:
                  id_solicitud: 4f8c1a2b-3d4e-4f5a-8b6c-7d8e9f0a1b2c
                  estado: Borrador
        "400":
          $ref: "#/components/responses/ErrorValidacionSolicitud"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "409":
          $ref: "#/components/responses/SolicitudYaEnviada"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/solicitudes/cliente:
    post:
      tags: [Solicitudes]
      operationId: guardarBorradorSolicitudCliente
      summary: Crear o actualizar borrador de solicitud (ruta de cliente)
      description: Misma operación que `POST /api/solicitudes`, expuesta bajo el prefijo `/cliente` que usa la app.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorradorSolicitud"
      responses:
        "200":
          description: Borrador actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorradorRespuesta"
        "201":
          description: Borrador creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorradorRespuesta"
        "400":
          $ref: "#/components/responses/ErrorValidacionSolicitud"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "409":
          $ref: "#/components/responses/SolicitudYaEnviada"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/solicitudes/{id}/documentos:
    parameters:
      - $ref: "#/components/parameters/IdSolicitud"
    post:
      tags: [Solicitudes]
      operationId: subirDocumentoSolicitud
      summary: Subir documento de la solicitud
      description: |
        Sube o reemplaza un documento de la solicitud. Acepta PDF, JPG o PNG de hasta 2 MB.
        Solo el dueño de la solicitud puede subir documentos, y solo mientras la solicitud sea editable.
        Al reemplazar, el documento anterior del mismo tipo se elimina.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubidaDocumento"
      responses:
        "200":
          description: Documento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoSubido"
              example:
                success: true
                message: Documento subido y registrado exitosamente
                id_documento: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                url_archivo: https://xyzcompany.supabase.co/storage/v1/object/public/solicitudes/ine.pdf
                fileName: ine.pdf
                sizeBytes: 524288
                data:
                  id_documento: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                  tipo: INE
                  url_archivo: https://xyzcompany.supabase.co/storage/v1/object/public/solicitudes/ine.pdf
                  nombre_archivo: ine.pdf
                  tamano_bytes: 524288
        "400":
          description: Falta el archivo, el tipo es inválido o el identificador no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              examples:
                sinArchivo:
                  summary: Sin archivo
                  value:
                    success: false
                    error: No se proporcionó ningún archivo
                    message: No se proporcionó ningún archivo
                tipoInvalido:
                  summary: Tipo inválido
                  value:
                    success: false
                    message: Tipo de documento inválido. Usa INE o DOMICILIO.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          description: La solicitud pertenece a otro usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: No tienes permiso para modificar esta solicitud.
        "404":
          description: No se encontró la solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: No se encontró la solicitud
        "409":
          description: La solicitud ya fue enviada y no admite cambios en documentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: La solicitud ya fue enviada y no permite modificar documentos.
        "413":
          description: El archivo supera los 2 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: El archivo supera los 2 MB.
        "415":
          description: Formato de archivo no permitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: Formato no permitido. Usa PDF, JPG o PNG.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/solicitudes/{id}/enviar:
    parameters:
      - $ref: "#/components/parameters/IdSolicitud"
    post:
      tags: [Solicitudes]
      operationId: enviarSolicitud
      summary: Enviar solicitud de adopción
      description: |
        Envía el borrador a revisión. Valida todos los campos del formulario y exige los documentos INE y
        comprobante de domicilio. Pasa la solicitud a `Pendiente de Revisión`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Solicitud enviada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudEnviada"
              example:
                success: true
                message: Solicitud enviada correctamente.
                data:
                  id_solicitud: 4f8c1a2b-3d4e-4f5a-8b6c-7d8e9f0a1b2c
                  estado: Pendiente de Revisión
        "400":
          $ref: "#/components/responses/ErrorValidacionSolicitud"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          description: No se encontró la solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: No se encontró la solicitud.
        "409":
          $ref: "#/components/responses/SolicitudYaEnviada"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

