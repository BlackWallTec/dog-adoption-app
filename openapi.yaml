        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ArchivosCfdiConfirmacion"
      responses:
        "201":
          description: CFDI guardado. El resultado del correo viene en `correo`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CfdiAlmacenado"
              example:
                almacenado: true
                correo:
                  estado: Enviado
        "400":
          $ref: "#/components/responses/ErrorCfdi400"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/ErrorCfdi404"
        "409":
          $ref: "#/components/responses/ErrorCfdi409"
        "413":
          $ref: "#/components/responses/ErrorArchivoGrande"
        "415":
          $ref: "#/components/responses/ErrorCfdi415"
        "422":
          $ref: "#/components/responses/ErrorCfdi422"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoSimple"

