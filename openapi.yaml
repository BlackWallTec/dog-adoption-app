                $ref: "#/components/schemas/CfdiValidado"
              example:
                valido: true
                uuid: 6ba7b810-9dad-41d1-80b4-00c04fd430c8
                rfc_receptor: PEPJ950412ABC
                monto: 500
                donativo:
                  id_donativo: 1b4e28ba-2fa1-41d2-883f-0016d3cca427
                  monto: 500
                  rfc: PEPJ950412ABC
