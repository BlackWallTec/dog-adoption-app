openapi: 3.1.0
info:
  title: Qariño Animal API
  version: 0.40.0
  summary: API REST del programa de adopción Qariño Animal
  description: |
    API REST de **Qariño Animal** (Express 5 + Supabase), usada por el panel web y por la app Android.

    ## Autenticación

    - **Web:** la sesión viaja en la cookie `token` (esquema `CookieAuth`). Se crea con `POST /api/perfiles/login`.
    - **App Android:** se envían el encabezado `x-client: mobile` y `Authorization: Bearer <token>` (esquema `BearerAuth`). Sin `x-client: mobile`, el encabezado `Authorization` se ignora y la sesión se busca en la cookie.
    - Las operaciones protegidas declaran `security`. Si falta el token o no es válido responden `401`; si el rol de la cuenta no tiene permiso, responden `403`.

    ## Formato de errores

    Cada módulo responde errores con una forma distinta. Cada operación documenta la suya:

    - `ErrorEstandar`: `{ "error", "code", "fields" }`. Lo usan perfiles y el envío de solicitudes.
    - `ErrorMensaje`: `{ "success": false, "message", "errors" }`. Lo usan catálogo, donativos y voluntariado.
    - `ErrorSimple`: `{ "error" }`. Lo usan el middleware de autenticación y varias rutas de administración.
    - `ErrorLimite`: `{ "ok": false, "error" }`. Lo devuelve el limitador de peticiones con `429`.

    Algunas respuestas de voluntariado y catálogo usan la clave `sucess` (sin la `c`). Se documenta tal como la devuelve el servidor.

    ## Límite de peticiones

    Varias rutas tienen un límite por ventana de tiempo. Al excederlo responden `429`. Las rutas de perfiles usan Redis (Upstash) cuando está configurado.
  contact:
    name: Equipo Qariño Animal
  license:
    name: Propietario
    identifier: UNLICENSED

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
  - url: https://dog-adoption-app-mauve.vercel.app
    description: Servidor desplegado en Vercel

tags:
  - name: Catálogo
    description: Consulta y administración del catálogo de perros en adopción (`/api/catalogo`).
  - name: Donativos
    description: Donativos, datos fiscales y CFDI (`/api/donativos`).
  - name: Perfiles
    description: Inicio de sesión, registro de cuentas, correo móvil y catálogo de códigos postales (`/api/perfiles`).
  - name: Solicitudes
    description: Solicitudes de adopción, documentos y revisión administrativa (`/api/solicitudes`).
  - name: Voluntarios
    description: Programas de voluntariado, inscripciones y calendario (`/api/voluntarios`).
  - name: Salud
    description: Verificación de disponibilidad del servicio.

paths:
  # ============================================================
  # SALUD
  # ============================================================
  /api/health:
    get:
      tags: [Salud]
      operationId: obtenerEstadoServicio
      security: []
      summary: Verificar disponibilidad
      description: Responde `ok` si el servidor está en funcionamiento. No requiere autenticación.
      responses:
        "200":
          description: El servicio está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoServicio"
              example:
                status: ok

  # ============================================================
  # PERFILES
  # ============================================================
  /api/perfiles/login:
    post:
      tags: [Perfiles]
      operationId: iniciarSesion
      security: []
      summary: Iniciar sesión
      description: |
        Valida correo y contraseña. En web responde con la cookie `token` (HttpOnly). Con `x-client: mobile`
        responde además el campo `token` en el cuerpo para usarlo como Bearer.

        La duración de la sesión depende del rol: Root 1 hora, Administrador 6 horas y Cliente 72 horas.
        Las cuentas de Cliente con correo móvil pendiente de confirmación reciben `403`.
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              correo: ana@gmail.com
              contrasena: contrasena123
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRespuesta"
              examples:
                web:
                  summary: Web (cookie)
                  value:
                    user:
                      uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      rol: Cliente
                movil:
                  summary: Android (token en el cuerpo)
                  value:
                    user:
                      uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      rol: Cliente
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1dWlkIjoiN2M5ZSJ9.firma
        "400":
          description: Faltan el correo o la contraseña.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Correo y contraseña son requeridos
                code: BAD_REQUEST
        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Credenciales inválidas
                code: INVALID_CREDENTIALS
        "403":
          description: El correo de la cuenta de Cliente aún no está confirmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Confirma tu correo antes de iniciar sesión.
                code: EMAIL_NOT_CONFIRMED
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoEstandar"

  /api/perfiles/logout:
    post:
      tags: [Perfiles]
      operationId: cerrarSesion
      security: []
      summary: Cerrar sesión
      description: Elimina la cookie `token`. La app Android descarta su token localmente.
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkRespuesta"
              example:
                ok: true

  /api/perfiles/profile:
    get:
      tags: [Perfiles]
      operationId: obtenerPerfil
      summary: Obtener perfil del usuario
      description: Devuelve los datos personales y de domicilio de la cuenta en sesión. El usuario sale del token.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Perfil del usuario en sesión.
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/PerfilUsuario"
                example:
                  profile:
                    nombre: Ana
                    apellidos: Pérez López
                    fecha_nacimiento: "1995-04-12"
                    telefono: "5512345678"
                    calle: Av. Juárez
                    numero_exterior: "45"
                    codigo_postal: "06000"
        "401":
          $ref: "#/components/responses/NoAutenticadoEstandar"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/perfiles/me:
    get:
      tags: [Perfiles]
      operationId: obtenerSesion
      summary: Consultar la sesión actual
      description: Confirma que el token es válido y que la cuenta sigue existiendo. No devuelve el correo.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Sesión vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRespuesta"
              example:
                user:
                  uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  rol: Cliente
        "401":
          $ref: "#/components/responses/NoAutenticadoEstandar"
        "500":
          $ref: "#/components/responses/ErrorInternoEstandar"

  /api/perfiles/register:
    post:
      tags: [Perfiles]
      operationId: registrarCliente
      security: []
      summary: Crear cuenta de Cliente
      description: |
        Alta pública de cuentas de Cliente. No requiere sesión. Responde `201` con el usuario creado.

        Si el correo móvil está habilitado, la cuenta queda pendiente de confirmación (`requiereConfirmacion: true`)
        y se envía un código al correo.
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroCuenta"
            example:
              nombre: Ana
              apellidos: Pérez López
              fecha_nacimiento: "1995-04-12"
              correo: ana@gmail.com
              telefono: "5512345678"
              contrasena: contrasena123
              confirmContrasena: contrasena123
              id_codigo_postal: 3f2b8c1e-7a4d-4e9b-9c2f-1d5e6a7b8c9d
              calle: Av. Juárez
              numero_exterior: "45"
              numero_interior: null
              privacidad: true
      responses:
        "201":
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroRespuesta"
              example:
                user:
                  uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  rol: Cliente
                requiereConfirmacion: true
                correoEnviado: true
        "409":
          description: Ya existe una cuenta con ese correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Ya existe una cuenta con ese correo
                code: EMAIL_EXISTS
                fields:
                  correo: Ya existe una cuenta con ese correo
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoEstandar"

  /api/perfiles/register-admin:
    post:
      tags: [Perfiles]
      operationId: registrarAdministrador
      summary: Crear cuenta de Administrador
      description: Alta de cuentas de Administrador desde el panel web. Solo puede hacerla un usuario con rol `Root`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroCuenta"
      responses:
        "201":
          description: Administrador creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroRespuesta"
              example:
                user:
                  uuid: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  rol: Administrador
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "409":
          description: Ya existe una cuenta con ese correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Ya existe una cuenta con ese correo
                code: EMAIL_EXISTS
                fields:
                  correo: Ya existe una cuenta con ese correo
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoEstandar"

  /api/perfiles/codigos-postales:
    get:
      tags: [Perfiles]
      operationId: buscarCodigosPostales
      security: []
      summary: Buscar colonias por código postal
      description: Devuelve las colonias que corresponden a un código postal. Se usa antes del inicio de sesión. Si el código no existe, `data` llega vacío.
      parameters:
        - name: cp
          in: query
          required: true
          description: Código postal de 5 dígitos.
          schema:
            type: string
            pattern: '^\d{5}$'
            example: "06000"
      responses:
        "200":
          description: Colonias del código postal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CodigoPostal"
                example:
                  data:
                    - id_codigo_postal: 3f2b8c1e-7a4d-4e9b-9c2f-1d5e6a7b8c9d
                      codigo_postal: "06000"
                      colonia: Centro
                      municipio: Cuauhtémoc
                      estado: Ciudad de México
        "422":
          description: El código postal no tiene 5 dígitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Código postal inválido
                code: VALIDATION_ERROR
                fields:
                  cp: El código postal debe tener 5 dígitos.
        "500":
          $ref: "#/components/responses/ErrorInternoEstandar"

  /api/perfiles/correo-movil/config:
    get:
      tags: [Perfiles]
      operationId: obtenerConfiguracionCorreoMovil
      security: []
      summary: Consultar si el correo móvil está habilitado
      description: La app usa esta respuesta para decidir si muestra la confirmación de correo.
      responses:
        "200":
          description: Configuración del correo móvil.
          headers:
            Cache-Control:
              description: Siempre `no-store`.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionCorreoMovil"
              example:
                habilitado: false

  /api/perfiles/correo-movil/reenviar:
    post:
      tags: [Perfiles]
      operationId: reenviarCodigoConfirmacion
      security: []
      summary: Reenviar código de confirmación
      description: |
        Envía un nuevo código de confirmación de cuenta. Responde siempre `202` con el mismo mensaje genérico,
        para no revelar si el correo pertenece a una cuenta. El código dura 15 minutos y puede pedirse de nuevo
        cada minuto. La confirmación debe hacerse dentro de las 72 horas posteriores al registro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorreoRequest"
            example:
              correo: ana@gmail.com
      responses:
        "202":
          $ref: "#/components/responses/RespuestaGenericaCorreo"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "503":
          $ref: "#/components/responses/CorreoNoDisponible"

  /api/perfiles/correo-movil/recuperar:
    post:
      tags: [Perfiles]
      operationId: solicitarCodigoRecuperacion
      security: []
      summary: Solicitar código para recuperar contraseña
      description: Envía un código de 6 dígitos al correo de la cuenta. Responde siempre `202` con el mismo mensaje genérico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorreoRequest"
            example:
              correo: ana@gmail.com
      responses:
        "202":
          $ref: "#/components/responses/RespuestaGenericaCorreo"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "503":
          $ref: "#/components/responses/CorreoNoDisponible"

  /api/perfiles/correo-movil/confirmar:
    post:
      tags: [Perfiles]
      operationId: confirmarCorreo
      security: []
      summary: Confirmar correo con código
      description: Confirma la cuenta de Cliente con el código de 6 dígitos. El código se consume al usarse y tiene como máximo 5 intentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorreoConfirmarRequest"
            example:
              correo: ana@gmail.com
              codigo: "482913"
      responses:
        "200":
          $ref: "#/components/responses/OkCorreo"
        "400":
          $ref: "#/components/responses/CodigoInvalido"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "503":
          $ref: "#/components/responses/CorreoNoDisponible"

  /api/perfiles/correo-movil/restablecer:
    post:
      tags: [Perfiles]
      operationId: restablecerContrasena
      security: []
      summary: Restablecer contraseña con código
      description: |
        Cambia la contraseña con el código recibido por correo. La nueva contraseña debe tener entre 8 y 72 bytes
        y repetirse en `confirmContrasena`. El código no se consume si la contraseña no quedó guardada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorreoRestablecerRequest"
            example:
              correo: ana@gmail.com
              codigo: "482913"
              contrasena: nuevaContrasena123
              confirmContrasena: nuevaContrasena123
      responses:
        "200":
          $ref: "#/components/responses/OkCorreo"
        "400":
          $ref: "#/components/responses/CodigoInvalido"
        "422":
          description: La nueva contraseña no cumple los requisitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: Error de validación en los datos
                code: VALIDATION_ERROR
                fields:
                  contrasena: Usa al menos 8 caracteres, máximo 72 bytes, y repite la misma contraseña.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "503":
          description: No se pudo comprobar el cambio de contraseña o el correo móvil no está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
              example:
                error: No se pudo comprobar el cambio de contraseña. Inténtalo de nuevo.
                code: PASSWORD_UPDATE_FAILED

  # ============================================================
  # CATÁLOGO
  # ============================================================
  /api/catalogo/admin/solicitar-subida:
    post:
      tags: [Catálogo]
      operationId: solicitarUrlSubidaMultimedia
      summary: Solicitar URL de subida de multimedia
      description: |
        Genera una URL firmada para subir una foto o video del perro al bucket `multimedia_perros`. La URL vence
        en 300 segundos. Después hay que registrar el perro con `POST /api/catalogo/admin/perros`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudSubida"
            example:
              id_perro_temporal: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              nombreArchivo: foto_perfil.jpg
              tipoMime: image/jpeg
      responses:
        "200":
          description: URL de subida generada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubidaMultimediaRespuesta"
              example:
                message: Pase de subida generado exitosamente
                uploadUrl: https://xyzcompany.supabase.co/storage/v1/object/upload/sign/multimedia_perros/perros/7c9e6679/1732633200000_foto_perfil.jpg?token=abc
                rutaFinal: perros/7c9e6679-7425-40de-944b-e07fc1f90ae7/1732633200000_foto_perfil.jpg
                publicUrl: https://xyzcompany.supabase.co/storage/v1/object/public/multimedia_perros/perros/7c9e6679/1732633200000_foto_perfil.jpg
        "400":
          $ref: "#/components/responses/ErrorSimpleBadRequest"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoSimple"

  /api/catalogo/admin/perros:
    get:
      tags: [Catálogo]
      operationId: listarPerrosAdmin
      summary: Listar todos los perros (administración)
      description: Devuelve la ficha completa de cada perro, incluidos los inactivos.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Lista de perros.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PerroAdmin"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"
    post:
      tags: [Catálogo]
      operationId: registrarPerro
      summary: Registrar un perro
      description: |
        Crea el perro junto con sus relaciones (raza, tamaño, características y multimedia) mediante un procedimiento
        almacenado. Los campos `nombre`, `sexo`, `esterilizado`, `vacunado`, `estado`, `id_raza`, `id_tamano`,
        `multimedia` y `caracteres` son obligatorios.

        Responde `200` (no `201`) con el perro creado.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoPerro"
            example:
              nombre: Luna
              sexo: Hembra
              edad_aprox: 2
              tamano_medida: 45.5
              descripcion: Juguetona y tranquila con niños.
              cuidado_especial: Requiere medicación para la alergia cada mañana.
              esterilizado: true
              vacunado: true
              estado: Disponible
              id_raza: 5d41402a-bc4b-4a76-b971-9d911017c592
              id_tamano: 2b7e1516-28ae-4d2a-9b0a-8f3c5e2d1a9b
              multimedia:
                - url: https://xyzcompany.supabase.co/storage/v1/object/public/multimedia_perros/luna.jpg
                  tipo: foto
              caracteres:
                - 9a1f3c2e-6b4d-4e8a-8c1f-2d3e4f5a6b7c
      responses:
        "200":
          description: Perro registrado.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Perro creado tal como lo devuelve el procedimiento almacenado.
                    additionalProperties: true
        "400":
          description: Datos inválidos en la solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: Datos inválidos en la solicitud.
                errors:
                  - El campo obligatorio 'nombre' está vacío.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/catalogo/admin/perros/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPerro"
    get:
      tags: [Catálogo]
      operationId: obtenerPerroAdmin
      summary: Obtener ficha de un perro (administración)
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Ficha del perro.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PerroAdmin"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
