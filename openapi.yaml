      description: |
        Modifica solo los campos enviados. Los campos que no son editables (como `estado`, `fotos` o `id_perro`)
        responden `400` con el detalle en `errors`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizacionPerro"
            example:
              nombre: Luna
              edad_aprox: 3
              descripcion: null
              esterilizado: true
      responses:
        "200":
          description: Ficha actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PerroAdmin"
        "400":
          description: Campos inválidos o sin cambios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              examples:
                camposInvalidos:
                  summary: Campos inválidos
                  value:
                    success: false
                    message: Hay campos inválidos.
                    errors:
                      edad_aprox: La edad debe ser un entero entre 0 y 30.
                raza:
                  summary: Raza o tamaño inexistente
                  value:
                    success: false
                    message: La raza o el tamaño seleccionado no existe.
                    errors:
                      id_raza: Revisa la raza.
                      id_tamano: Revisa el tamaño.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/PerroNoEncontrado"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

