      operationId: cargarCfdi
      summary: Cargar CFDI y enviarlo por correo
      description: |
        Guarda el PDF y el XML validados y envía el CFDI al correo de facturación del donante. Requiere que el
        administrador confirme la revisión del PDF con `confirmar_pdf=true`.

        Si el envío de correo falla, el CFDI queda guardado y la respuesta incluye `correo.estado` = `Error`.
      security:
        - BearerAuth: []
        - CookieAuth: []
