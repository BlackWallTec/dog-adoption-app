          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [dog, behavior, multimedia]
                    properties:
                      dog:
                        $ref: "#/components/schemas/PerroCliente"
                      behavior:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      multimedia:
                        type: array
                        items:
                          $ref: "#/components/schemas/Multimedia"
        "500":
          description: Error al consultar el perro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensajeSucess"
              example:
                sucess: false
                message: Error interno al consultar el perro.

