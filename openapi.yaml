  /api/catalogo/cliente/perros:
    get:
      tags: [Catálogo]
      operationId: listarPerrosCliente
      security: []
      summary: Listar perros disponibles para adopción
      description: |
        Lista los perros activos. Todos los filtros son opcionales y se combinan. Sin filtros se devuelve el catálogo completo.

        Cada perro incluye `foto_url` con su primera imagen, o cadena vacía si no tiene.

        **Nota:** la respuesta exitosa usa la clave `syuccess` en la implementación actual.
      parameters:
        - name: sexo
          in: query
          description: Sexo del perro. Valores válidos `Macho` o `Hembra` (sin distinguir mayúsculas).
          schema:
            type: string
            enum: [Macho, Hembra]
        - name: tamano
          in: query
          description: Identificador del tamaño.
          schema:
            type: string
        - name: raza
          in: query
          description: Identificador de la raza.
          schema:
            type: string
        - name: edad
          in: query
          description: "Rango de edad. `cachorro` (0 a 1 años), `adulto` (2 a 4 años), `senior` (5 años o más)."
          schema:
            type: string
            enum: [cachorro, adulto, senior]
        - name: caracter
          in: query
          description: Identificadores de características separados por coma. El perro debe tener todas.
          schema:
            type: string
            example: 9a1f3c2e-6b4d-4e8a-8c1f-2d3e4f5a6b7c,1e2d3c4b-5a69-4788-9fed-cba987654321
      responses:
        "200":
          description: Perros que coinciden con los filtros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaPerrosCliente"
              example:
                syuccess: true
                data:
                  - id_perro: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    nombre: Luna
                    sexo: Hembra
                    edad_aprox: 2
                    foto_url: https://xyzcompany.supabase.co/storage/v1/object/public/multimedia_perros/luna.jpg
        "400":
          description: Parámetro inválido, repetido o con un identificador mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              examples:
                parametroInvalido:
                  summary: Valor de sexo no válido
                  value:
                    success: false
                    message: "Parámetro inválido: sexo"
                identificadorInvalido:
                  summary: Identificador con formato incorrecto
                  value:
                    success: false
                    message: "Parámetro inválido: tamano, raza o caracter"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/catalogo/cliente/perros/{id}:
    parameters:
