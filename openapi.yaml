        Lista paginada de solicitudes, de 10 por página. Incluye un resumen con los conteos por estado.
        Solo para `Administrador` o `Root`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: perro
          in: query
          description: Filtra por identificador de perro. `todos` no filtra.
          schema:
            type: string
            default: todos
        - name: estado
          in: query
          description: Filtra por estado. `todos` no filtra, `pendientes` agrupa `por_revisar` y `en_revision`.
          schema:
            type: string
            default: todos
            enum: [todos, pendientes, por_revisar, en_revision, aprobada, rechazada]
