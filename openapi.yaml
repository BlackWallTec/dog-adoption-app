  /api/voluntarios/programas/{idPrograma}/inscripciones:
    parameters:
      - $ref: "#/components/parameters/IdPrograma"
    post:
      tags: [Voluntarios]
      operationId: inscribirseAPrograma
      summary: Inscribirse a un programa
      description: |
        Inscribe al usuario en el programa. La validación de reglas y la inscripción se hacen en una sola transacción.

        Códigos de error: `PROGRAMA_NO_ENCONTRADO` (404), `PROGRAMA_NO_DISPONIBLE`, `PROGRAMA_INICIADO`,
        `YA_INSCRITO` y `SIN_CUPO` (409).

        **Nota:** las respuestas usan la clave `sucess` en la implementación actual.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "201":
          description: Inscripción registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InscripcionCreada"
              example:
                sucess: true
                data:
                  id_programa: 1b4e28ba-2fa1-41d2-883f-0016d3cca427
                  fecha_inscripcion: "2026-11-20T10:00:00"
                  estado: Aceptado
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/ProgramaNoEncontradoInscripcion"
        "409":
          $ref: "#/components/responses/ConflictoInscripcion"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoInscripcion"
    patch:
      tags: [Voluntarios]
      operationId: cancelarInscripcion
      summary: Cancelar mi inscripción
      description: |
        Cancela la inscripción del usuario. No borra la fila, cambia su estado de `Aceptado` a `Pendiente`.
        No se puede cancelar una vez que el programa comenzó.

        **Nota:** las respuestas usan la clave `sucess` en la implementación actual.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Inscripción cancelada.
          content:
            application/json:
              schema:
                type: object
                required: [sucess, data]
                properties:
                  sucess:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    description: Inscripción tras la cancelación.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/ProgramaNoEncontradoInscripcion"
        "409":
          description: El programa ya comenzó o el usuario no está inscrito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInscripcion"
              examples:
                iniciado:
                  summary: Programa iniciado
                  value:
                    sucess: false
                    code: PROGRAMA_INICIADO
                    message: El programa ya comenzó, ya no puedes cancelar.
                noInscrito:
                  summary: No inscrito
                  value:
                    sucess: false
                    code: NO_INSCRITO
                    message: No estás inscrito en este programa.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoInscripcion"

  /api/voluntarios/admin/programas/calendario:
    get:
      tags: [Voluntarios]
      operationId: obtenerCalendarioProgramas
      summary: Consultar calendario de programas
      description: |
        Devuelve los programas del rango ampliado a semanas completas y las semanas sin cobertura
        (sin ningún programa activo). Solo para `Administrador` o `Root`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: desde
          in: query
          required: true
          description: Fecha de inicio del rango, en formato `AAAA-MM-DD`.
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: hasta
          in: query
          required: true
          description: Fecha de fin del rango, en formato `AAAA-MM-DD`.
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        "200":
          description: Calendario del rango.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarioProgramas"
        "400":
          $ref: "#/components/responses/RangoInvalido"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoVoluntariado"

  /api/voluntarios/admin/programas/{idPrograma}:
    parameters:
      - $ref: "#/components/parameters/IdPrograma"
    get:
      tags: [Voluntarios]
      operationId: obtenerProgramaParaEditar
      summary: Obtener programa para editar
      description: Devuelve los campos del programa, el número de inscritos activos y si todavía es editable.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Programa con sus datos de edición.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProgramaEditable"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/ProgramaNoEncontradoVoluntariado"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoVoluntariado"
    put:
      tags: [Voluntarios]
      operationId: editarPrograma
      summary: Editar programa
      description: |
        Actualiza solo los campos enviados y valida el programa completo. Si hay empalmes con otros programas,
        responde `409` con `code` = `OVERLAP` hasta que se envíe `confirmarEmpalme: true`.

        Si el cupo es menor a los inscritos activos responde `409` con `CUPO_MENOR_A_INSCRITOS`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionPrograma"
            example:
              cupoMaximo: 20
              ubicacion: Parque Lira, zona de juegos
              confirmarEmpalme: false
      responses:
        "200":
          description: Programa actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEdicionPrograma"
              example:
                success: true
                data:
                  programa:
                    idPrograma: 1b4e28ba-2fa1-41d2-883f-0016d3cca427
                    nombre: Jornada de paseo
                  inscritosActivos: 5
                  avisarInscritos: true
        "400":
          $ref: "#/components/responses/ValidacionVoluntariado"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/ProgramaNoEncontradoVoluntariado"
        "409":
          description: El programa no es editable, el cupo es menor a los inscritos o hay empalmes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorVoluntariado"
              examples:
                noEditable:
                  summary: Programa no editable
                  value:
                    success: false
                    code: PROGRAMA_NO_EDITABLE
                    message: Este programa ya no se puede editar.
                cupo:
                  summary: Cupo menor a inscritos
                  value:
                    success: false
                    code: CUPO_MENOR_A_INSCRITOS
                    message: "Hay 5 inscritos, el cupo no puede ser menor."
                    inscritosActivos: 5
                empalme:
                  summary: Empalme con otro programa
                  value:
                    success: false
                    code: OVERLAP
                    message: Existen jornadas que coinciden con el horario.
                    empalmes:
                      - idPrograma: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                        nombre: Jornada de limpieza
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoVoluntariado"

  /api/voluntarios/admin/programas/{idPrograma}/cancelacion:
