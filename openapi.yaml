  /api/donativos/cliente/datos-fiscales:
    get:
      tags: [Donativos]
      operationId: obtenerDatosFiscales
      summary: Consultar datos fiscales del donante
      description: Devuelve los datos fiscales de la cuenta en sesión. Solo para rol `Cliente`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Datos fiscales.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DatosFiscales"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"
    put:
      tags: [Donativos]
      operationId: guardarDatosFiscales
      summary: Guardar datos fiscales
      description: Guarda o actualiza los datos fiscales para emitir el CFDI. El RFC se guarda en mayúsculas.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatosFiscalesEntrada"
            example:
              rfc: PEPJ950412ABC
              razon_social: Ana Pérez López
              regimen_fiscal: "612"
              codigo_postal: "06000"
              correo_facturacion: ana@gmail.com
      responses:
        "200":
          description: Datos guardados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeExitoso"
              example:
                success: true
                message: Datos fiscales guardados.
        "400":
          description: Datos incompletos o inválidos.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errores]
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Datos incompletos.
                  errores:
                    type: object
                    additionalProperties:
                      type: string
                example:
                  success: false
                  message: Datos incompletos.
                  errores:
                    rfc: RFC inválido
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/donativos/cliente/datos-fiscales/constancia:
    put:
      tags: [Donativos]
      operationId: subirConstanciaFiscal
      summary: Subir constancia de situación fiscal
      description: |
        Guarda la constancia enviando el archivo crudo en el cuerpo de la petición (no es multipart).
        Acepta PDF, JPG o PNG, con un máximo de 10 MB.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Constancia guardada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Constancia guardada.
                  data:
                    type: object
                    required: [constancia_url]
                    properties:
                      constancia_url:
                        type: string
                        format: uri
                        example: https://xyzcompany.supabase.co/storage/v1/object/public/constancias/7c9e6679.pdf
        "400":
          description: Tipo de archivo no permitido o cuerpo vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: Sube tu constancia en PDF, JPG o PNG.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "413":
          description: El archivo supera los 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: El archivo supera el límite permitido.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/donativos/cliente/donativos:
    post:
      tags: [Donativos]
      operationId: registrarDonativo
      summary: Registrar un donativo
      description: |
        Registra un donativo con su comprobante. El monto va en la query y el comprobante es el archivo crudo
        en el cuerpo (PDF, JPG o PNG, máximo 10 MB). El donativo queda pendiente de validar.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: monto
          in: query
          required: true
          description: Monto mayor que cero, con como máximo dos decimales.
          schema:
            type: string
            example: "500.00"
        - name: referencia
          in: query
          required: false
          description: Referencia opcional del pago, de hasta 200 caracteres.
          schema:
            type: string
            maxLength: 200
            example: Transferencia 0012345
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Donativo registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonativoRegistrado"
              example:
                success: true
                message: Donativo registrado.
                data:
                  id_donativo: 1b4e28ba-2fa1-41d2-883f-0016d3cca427
                  estado: Pendiente
        "400":
          description: Monto, referencia o comprobante inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              examples:
                montoInvalido:
                  summary: Monto inválido
                  value:
                    success: false
                    message: Escribe un monto válido.
                comprobanteInvalido:
                  summary: Comprobante no permitido
                  value:
                    success: false
                    message: Adjunta tu comprobante en PDF, JPG o PNG.
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "413":
          description: El comprobante supera los 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              example:
                success: false
                message: El comprobante supera el límite permitido.
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/donativos/cliente/mis-donativos:
    get:
      tags: [Donativos]
      operationId: listarMisDonativos
      summary: Listar mis donativos
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: Donativos del usuario en sesión.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DonativoCliente"
        "401":
          $ref: "#/components/responses/NoAutenticadoSimple"
        "403":
          $ref: "#/components/responses/SinPermisos"
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"
        "500":
          $ref: "#/components/responses/ErrorInternoMensaje"

  /api/donativos/cliente/mis-donativos/{idDonativo}/cfdi:
    parameters:
      - name: idDonativo
        in: path
        required: true
        description: Identificador del donativo.
        schema:
          type: string
          format: uuid
    post:
      tags: [Donativos]
      operationId: solicitarCfdi
      summary: Solicitar CFDI de un donativo
      description: Crea la solicitud de CFDI para un donativo ya validado. Solo se puede pedir una vez por donativo.
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "201":
          description: Solicitud creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeExitoso"
              example:
                success: true
                message: Solicitud de CFDI enviada
        "400":
          description: El donativo no es válido, no está validado o ya tiene una solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMensaje"
              examples:
                noValidado:
                  summary: Donativo sin validar
                  value:
                    success: false
                    message: Tu donativo no esta validado
                yaSolicitado:
                  summary: Ya existe una solicitud
                  value:
                    success: false
                    message: Ya existe una solicitud de CFDI para este donativo
        "401":
