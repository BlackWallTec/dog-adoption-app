  /api/catalogo/test-limit:
    get:
      tags: [Catálogo]
      operationId: probarLimitePeticiones
      security: []
      summary: Probar el limitador de peticiones
      description: |
        Ruta de prueba del limitador. Permite 3 peticiones por minuto por IP y también se limita en desarrollo.
        Úsela solo para verificar la configuración.
      responses:
        "200":
          description: Petición aceptada.
          headers:
            X-RateLimit-Limit:
              description: Límite de la ventana.
              schema:
                type: integer
                example: 3
            X-RateLimit-Remaining:
              description: Peticiones restantes en la ventana.
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                type: object
                required: [ok, mensaje, peticionesRestantes]
                properties:
                  ok:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: ✅ Petición exitosa
                  peticionesRestantes:
                    type: integer
                    example: 2
        "429":
          $ref: "#/components/responses/LimiteDePeticiones"

  # ============================================================
  # DONATIVOS
  # ============================================================
  /api/donativos/pendientes/resumen:
