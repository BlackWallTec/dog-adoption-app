<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración | Perros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Iconografía -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Estilos globales del layout y específicos del módulo -->
    <link rel="stylesheet" href="../../CSS/layoutAdmin.css" />
    <link rel="stylesheet" href="../../CSS/cssCatalogo/adminPerros.css" />
  </head>

  <body>
    <div class="admin-layout">
      <!-- ======================================Menú lateral (Sidebar)====================================== -->
      <aside class="sidebar">
        <!-- 1. Encabezado del Sidebar -->
        <div class="sidebar-header">
          <div class="logo-box">
            <img src="../../public/logo.png" alt="Logo Qariño Animal A.C." class="logo-img" />
            <span class="panel-label">PANEL DE ADMINISTRACIÓN</span>
          </div>
        </div>

        <!-- 2. Navegación del Sidebar -->
        <nav class="sidebar-nav">
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded">grid_view</span>
            <span>Inicio</span>
          </a>
          <a href="#" class="nav-item active">
            <span class="material-symbols-rounded">pets</span>
            <span>Perros</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded">assignment</span>
            <span>Solicitudes</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded">volunteer_activism</span>
            <span>Voluntariado</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded">favorite</span>
            <span>Donativos</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded">settings</span>
            <span>Configuración</span>
          </a>
        </nav>

        <!-- 3. Pie del Sidebar -->
        <div class="sidebar-footer">
          <div class="care-card">
            <span class="material-symbols-rounded care-icon">favorite</span>
            <h4>Cuidamos juntos</h4>
            <p>Cada tarea acerca a un peludo a su nuevo hogar.</p>
          </div>
          <span class="footer-location">Qariño Animal · Querétaro</span>
        </div>
      </aside>
    </div>
  </body>
</html>
