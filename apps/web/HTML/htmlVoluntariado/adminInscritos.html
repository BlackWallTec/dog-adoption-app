<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración | Inscritos</title>
    <!-- Fuentes e iconos -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Roboto:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- CSS Atomico Global y Especifico -->
    <link rel="stylesheet" href="../../CSS/layoutAdmin.css" />
    <link rel="stylesheet" href="../../CSS/cssVoluntariado/adminInscritos.css" />

    <!-- Componentes reutilizables -->
    <script type="module" src="../../components/admin-sidebar.js"></script>
    <script type="module" src="../../components/admin-topbar.js"></script>
  </head>

  <body>
    <div class="admin-layout">
      <!-- Organismo 1: Sidebar -->
      <admin-sidebar></admin-sidebar>

      <div class="main-wrapper">
        <!-- Organismo 2: Topbar -->
        <admin-topbar></admin-topbar>

        <main class="content-area">
          <a href="./adminVoluntariado.html" class="back-link">
            <span class="material-symbols-rounded">arrow_back</span>
            Volver a programas
          </a>

          <div class="section-header">
            <div>
              <h1 id="programa-nombre" class="section-title">Cargando programa...</h1>
              <p id="programa-tipo" class="section-subtitle"></p>
            </div>
            <span id="programa-estado" class="badge-estado" hidden></span>
          </div>

          <!-- Aviso para programas cancelados o finalizados -->
          <p id="aviso-estado" class="aviso-estado" hidden></p>

          <!-- Resumen del programa -->
          <section id="resumen-programa" class="resumen-card" hidden>
            <div class="resumen-dato">
              <span class="material-symbols-rounded">calendar_month</span>
              <div>
                <span class="resumen-label">Fecha y horario</span>
                <span id="programa-fecha" class="resumen-valor"></span>
              </div>
            </div>
            <div class="resumen-dato">
              <span class="material-symbols-rounded">location_on</span>
              <div>
                <span class="resumen-label">Ubicación</span>
                <span id="programa-ubicacion" class="resumen-valor"></span>
              </div>
            </div>
            <div class="resumen-dato">
              <span class="material-symbols-rounded">group</span>
              <div>
                <span class="resumen-label">Inscritos</span>
                <span id="programa-cupo" class="resumen-valor"></span>
              </div>
            </div>
          </section>

          <!-- Lista de inscritos -->
          <div id="tabla-inscritos" class="table-card" hidden>
            <table class="inscritos-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Teléfono</th>
                  <th>Inscripción</th>
                  <th>Asistencia</th>
                </tr>
              </thead>
              <tbody id="tabla-inscritos-body">
                <!-- Filas renderizadas dinamicamente -->
              </tbody>
            </table>
          </div>

          <!-- Error de carga: no se muestra como lista vacia -->
          <div id="estado-error" class="estado-error" hidden>
            <span class="material-symbols-rounded">error</span>
            <p id="mensaje-error"></p>
            <button type="button" id="btn-reintentar" class="btn-primary">Reintentar</button>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../../JS/jsVoluntariado/adminInscritos.view.js"></script>
  </body>
</html>
