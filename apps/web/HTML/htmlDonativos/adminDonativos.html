<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración | Donativos</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Roboto:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    />

    <link rel="stylesheet" href="../../CSS/layoutAdmin.css" />
    <link rel="stylesheet" href="../../CSS/cssDonativos/adminDonativos.css" />

    <script type="module" src="../../components/admin-sidebar.js"></script>
    <script type="module" src="../../components/admin-topbar.js"></script>
  </head>

  <body>
    <div class="admin-layout">
      <admin-sidebar></admin-sidebar>

      <div class="main-wrapper">
        <admin-topbar></admin-topbar>

        <main class="content-area">
          <section id="donativos-login" class="table-card">
            <h2>Acceso administrativo de prueba</h2>
            <p>Inicia sesión para consultar los donativos pendientes.</p>

            <form id="donativos-login-form">
              <label for="donativos-email">Correo electrónico</label>
              <input id="donativos-email" type="email" autocomplete="username" required />

              <label for="donativos-password">Contraseña</label>
              <input
                id="donativos-password"
                type="password"
                autocomplete="current-password"
                required
              />

              <button type="submit">Iniciar sesión</button>
            </form>

            <p id="donativos-login-error" role="alert"></p>
          </section>

          <div class="section-header">
            <div>
              <h1 class="section-title">Administración de Donativos</h1>
              <p id="donativos-counter-subtitle" class="section-subtitle">Cargando donativos...</p>
            </div>
          </div>

          <div class="table-card">
            <table class="donations-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Donante</th>
                  <th>Monto</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                </tr>
              </thead>

              <tbody id="tabla-donativos-body">
                <tr>
                  <td colspan="5">Cargando donativos...</td>
                </tr>
              </tbody>
            </table>

            <div class="table-footer">
              <span id="pagination-info" class="pagination-text"> Mostrando 0 de 0 donativos </span>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../../JS/jsDonativos/adminDonativos.login.js"></script>

    <script type="module" src="../../JS/jsDonativos/adminDonativos.view.js"></script>
  </body>
</html>
