name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # was v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            javascript:
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: true

      - run: vp check

      - if: steps.filter.outputs.javascript == 'true'
        run: vp test

      - if: steps.filter.outputs.javascript == 'true'
        run: vp run -r build
