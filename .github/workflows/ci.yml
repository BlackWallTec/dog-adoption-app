name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/develop' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            javascript:
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'

            android:
              - 'apps/android/**'

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: true

      - run: vp check

      - if: steps.filter.outputs.javascript == 'true'
        run: vp test

      - if: steps.filter.outputs.javascript == 'true'
        run: vp run -r build

      - name: Set up JDK
        if: steps.filter.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.filter.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        if: steps.filter.outputs.android == 'true'
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest
