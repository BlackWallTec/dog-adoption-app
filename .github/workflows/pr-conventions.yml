name: pr-conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            web
            android
            contract
            perfiles
            donativos
            solicitudes
            catalogo
            voluntarios
            deps
          requireScope: false

  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(main|master|develop)$ ]]; then
            echo "Branch name OK"

          elif [[ "$BRANCH" =~ ^feature/(solicitudes|catalogo|perfiles|donativos|voluntariado)-hu[0-9]{2}+(-[a-z0-9]+)*$ ]]; then
            echo "Feature branch name OK"

          elif [[ "$BRANCH" =~ ^(bugfix|fix|hotfix|release|chore|docs)/[a-z0-9]+([.-][a-z0-9]+)*$ ]]; then
            echo "Branch name OK"

          else
            echo "Invalid branch name: $BRANCH"
            echo "Expected feature/<module>-hu<ticket>-<optional-description>"
            echo "Or <bugfix|fix|hotfix|release|chore|docs>/<short-description>"
            exit 1
          fi
